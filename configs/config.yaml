# LexBridge configuration. Paths are relative to the repo root.
paths:
  raw: data/raw
  processed: data/processed
  seed: data/seed
  fixtures: data/seed/fixtures
  benchmark: data/benchmark
  results: results
  tables: paper/tables

# sample_mode=true uses only seed + fixture data (no downloads).
sample_mode: true
sample_sizes:
  judgments: 200
  questions: 50

transition_date: "2024-07-01"

models:
  embedder: BAAI/bge-m3
  embedder_fallback: sentence-transformers/all-MiniLM-L6-v2
  reranker: BAAI/bge-reranker-v2-m3
  reranker_fallback: cross-encoder/ms-marco-MiniLM-L-6-v2
  # Set to false to try downloading real models; true forces built-in CPU fallbacks.
  offline: true

chunking:
  size: 400        # words
  overlap: 50

retrieval:
  bm25_k: 30
  dense_k: 30
  rrf_k: 60
  graph_k: 20
  rerank_top: 8

vector_store: numpy   # qdrant | faiss | numpy

llm:
  backend: auto       # auto | ollama | openai | mock
  ollama_model: qwen2.5:7b-instruct
  ollama_url: http://localhost:11434
  temperature: 0.0
  max_tokens: 800
